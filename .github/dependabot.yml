version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      python-dependencies:
        patterns:
          - "*"
    allow:
      - dependency-type: "direct"
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "npm"
    directory: "/frontend-vite"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    allow:
      - dependency-type: "direct"
    labels:
      - "dependencies"
      - "frontend"
