name: Staging Failure Drills

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: "Staging namespace"
        required: false
        default: "labs"
      simulate_image_pull_failure:
        description: "Run image pull failure simulation (true/false)"
        required: false
        default: "true"
  schedule:
    - cron: "33 8 * * 2"

permissions:
  contents: read

jobs:
  failure-drill:
    runs-on: ubuntu-latest
    env:
      NAMESPACE: ${{ github.event.inputs.namespace || 'labs' }}
      SIMULATE_IMAGE_PULL_FAILURE: ${{ github.event.inputs.simulate_image_pull_failure || 'true' }}
      KUBECONFIG_B64: ${{ secrets.STAGING_KUBECONFIG_B64 || secrets.KUBECONFIG_B64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install kubectl
        run: |
          set -euo pipefail
          curl -fsSL -o kubectl https://dl.k8s.io/release/v1.30.14/bin/linux/amd64/kubectl
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Setup kubeconfig
        run: |
          set -euo pipefail
          [ -n "${KUBECONFIG_B64}" ] || { echo "STAGING_KUBECONFIG_B64 (or KUBECONFIG_B64) secret is required." >&2; exit 1; }
          mkdir -p "${HOME}/.kube"
          printf '%s' "${KUBECONFIG_B64}" | base64 -d >"${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"
          kubectl -n "${NAMESPACE}" get deploy bretter-backend bretter-frontend bretter-postgres >/dev/null

      - name: Run staging failure drills
        run: |
          set -euo pipefail
          NAMESPACE="${NAMESPACE}" SIMULATE_IMAGE_PULL_FAILURE="${SIMULATE_IMAGE_PULL_FAILURE}" ./scripts/failure_drill_control_plane.sh

      - name: Upload failure drill report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-failure-drill-report
          path: artifacts/failure-drill/
          if-no-files-found: warn
