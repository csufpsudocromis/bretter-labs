name: Live Post-Deploy Smoke Gate

on:
  pull_request:
    branches:
      - main
      - "release/**"
  push:
    branches:
      - main
      - "release/**"
  workflow_dispatch:
    inputs:
      namespace:
        description: "Target namespace"
        required: false
        default: "labs"
  schedule:
    - cron: "37 11 * * *"

permissions:
  contents: read

jobs:
  live-smoke-gate:
    runs-on: ubuntu-latest
    env:
      NAMESPACE: ${{ github.event.inputs.namespace || 'labs' }}
      KUBECONFIG_B64: ${{ secrets.PRODUCTION_KUBECONFIG_B64 || secrets.KUBECONFIG_B64 }}
      DEPLOY_VALUES_PROD_SITE_B64: ${{ secrets.DEPLOY_VALUES_PROD_SITE_B64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Install kubectl
        run: |
          set -euo pipefail
          curl -fsSL -o kubectl https://dl.k8s.io/release/v1.30.14/bin/linux/amd64/kubectl
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Install qemu-img
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-utils
          qemu-img --version

      - name: Setup kubeconfig
        run: |
          set -euo pipefail
          [ -n "${KUBECONFIG_B64}" ] || { echo "PRODUCTION_KUBECONFIG_B64 (or KUBECONFIG_B64) secret is required." >&2; exit 1; }
          mkdir -p "${HOME}/.kube"
          printf '%s' "${KUBECONFIG_B64}" | base64 -d >"${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"
          kubectl -n "${NAMESPACE}" get ns "${NAMESPACE}" >/dev/null

      - name: Materialize optional site values
        run: |
          set -euo pipefail
          if [ -n "${DEPLOY_VALUES_PROD_SITE_B64}" ]; then
            printf '%s' "${DEPLOY_VALUES_PROD_SITE_B64}" | base64 -d > deploy/helm/values-prod-site.ci.yaml
          fi

      - name: Build synthetic upload fixture
        run: |
          set -euo pipefail
          qemu-img create -f qcow2 "${RUNNER_TEMP}/synthetic-upload.qcow2" 64M
          ls -lh "${RUNNER_TEMP}/synthetic-upload.qcow2"

      - name: Run live smoke proof
        run: |
          set -euo pipefail
          if [ -f deploy/helm/values-prod-site.ci.yaml ]; then
            NAMESPACE="${NAMESPACE}" \
              BASE_VALUES_FILE="$(pwd)/deploy/helm/values-production.yaml" \
              SITE_VALUES_FILE="$(pwd)/deploy/helm/values-prod-site.ci.yaml" \
              REQUIRE_SITE_VALUES_FILE=1 \
              RUN_RESTORE_DRILL=0 \
              SYNTHETIC_REQUIRE_IMAGE_UPLOAD_CHECK=1 \
              SYNTHETIC_IMAGE_UPLOAD_FILE="${RUNNER_TEMP}/synthetic-upload.qcow2" \
              SYNTHETIC_IMAGE_UPLOAD_NAME="synthetic-upload.qcow2" \
              SYNTHETIC_IMAGE_UPLOAD_TIMEOUT_SECONDS=1200 \
              ./scripts/production_go_live_proof.sh
          else
            NAMESPACE="${NAMESPACE}" \
              BASE_VALUES_FILE="$(pwd)/deploy/helm/values-production.yaml" \
              REQUIRE_SITE_VALUES_FILE=0 \
              RUN_RESTORE_DRILL=0 \
              SYNTHETIC_REQUIRE_IMAGE_UPLOAD_CHECK=1 \
              SYNTHETIC_IMAGE_UPLOAD_FILE="${RUNNER_TEMP}/synthetic-upload.qcow2" \
              SYNTHETIC_IMAGE_UPLOAD_NAME="synthetic-upload.qcow2" \
              SYNTHETIC_IMAGE_UPLOAD_TIMEOUT_SECONDS=1200 \
              ./scripts/production_go_live_proof.sh
          fi

      - name: Verify synthetic smoke gate report
        run: |
          set -euo pipefail
          report="$(ls -1t artifacts/go-live/production-go-live-*.txt 2>/dev/null | head -n1 || true)"
          [ -n "${report}" ] || { echo "Missing go-live report." >&2; exit 1; }
          python3 scripts/verify_synthetic_gate_report.py \
            --report "${report}" \
            --require-image-upload-check

      - name: Upload smoke proof reports
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: live-post-deploy-smoke-gate-reports
          path: artifacts/go-live/
          if-no-files-found: warn
