name: Config Drift Check

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: "Target namespace"
        required: false
        default: "labs"
  schedule:
    - cron: "11 */6 * * *"

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    env:
      NAMESPACE: ${{ github.event.inputs.namespace || 'labs' }}
      KUBECONFIG_B64: ${{ secrets.PRODUCTION_KUBECONFIG_B64 || secrets.KUBECONFIG_B64 }}
      DEPLOY_VALUES_PROD_SITE_B64: ${{ secrets.DEPLOY_VALUES_PROD_SITE_B64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Setup Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.15.4

      - name: Install kubectl
        run: |
          set -euo pipefail
          curl -fsSL -o kubectl https://dl.k8s.io/release/v1.30.14/bin/linux/amd64/kubectl
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Setup kubeconfig
        run: |
          set -euo pipefail
          [ -n "${KUBECONFIG_B64}" ] || { echo "PRODUCTION_KUBECONFIG_B64 (or KUBECONFIG_B64) secret is required." >&2; exit 1; }
          mkdir -p "${HOME}/.kube"
          printf '%s' "${KUBECONFIG_B64}" | base64 -d >"${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"

      - name: Materialize optional site values
        run: |
          set -euo pipefail
          if [ -n "${DEPLOY_VALUES_PROD_SITE_B64}" ]; then
            printf '%s' "${DEPLOY_VALUES_PROD_SITE_B64}" | base64 -d > deploy/helm/values-prod-site.ci.yaml
          fi

      - name: Check live config drift
        run: |
          set -euo pipefail
          cmd=(python3 scripts/check_live_config_drift.py --namespace "${NAMESPACE}" -f deploy/helm/values.yaml -f deploy/helm/values-production.yaml)
          if [ -f deploy/helm/values-prod-site.ci.yaml ]; then
            cmd+=(-f deploy/helm/values-prod-site.ci.yaml)
          fi
          "${cmd[@]}" | tee /tmp/config-drift-check.txt

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: config-drift-report
          path: /tmp/config-drift-check.txt
          if-no-files-found: warn
