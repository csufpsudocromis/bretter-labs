name: Deploy Production

on:
  push:
    branches:
      - main
    paths:
      - "deploy/helm/values-production.yaml"
      - ".github/workflows/deploy-production.yml"
  workflow_dispatch:
    inputs:
      namespace:
        description: "Target namespace"
        required: false
        default: "labs"
      release_name:
        description: "Helm release name"
        required: false
        default: "bretter-labs"

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.actor == 'github-actions[bot]' && startsWith(github.event.head_commit.message, 'chore(release): pin production image digests for v')) }}
    runs-on: ubuntu-latest
    env:
      NAMESPACE: ${{ github.event.inputs.namespace || 'labs' }}
      HELM_RELEASE_NAME: ${{ github.event.inputs.release_name || 'bretter-labs' }}
      KUBECONFIG_B64: ${{ secrets.PRODUCTION_KUBECONFIG_B64 || secrets.KUBECONFIG_B64 }}
      DEPLOY_VALUES_PROD_SITE_B64: ${{ secrets.DEPLOY_VALUES_PROD_SITE_B64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.15.4

      - name: Install kubectl
        run: |
          set -euo pipefail
          curl -fsSL -o kubectl https://dl.k8s.io/release/v1.30.14/bin/linux/amd64/kubectl
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Setup kubeconfig
        run: |
          set -euo pipefail
          [ -n "${KUBECONFIG_B64}" ] || { echo "PRODUCTION_KUBECONFIG_B64 (or KUBECONFIG_B64) secret is required." >&2; exit 1; }
          mkdir -p "${HOME}/.kube"
          printf '%s' "${KUBECONFIG_B64}" | base64 -d >"${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"
          kubectl -n "${NAMESPACE}" get ns "${NAMESPACE}" >/dev/null

      - name: Materialize optional site values
        run: |
          set -euo pipefail
          if [ -n "${DEPLOY_VALUES_PROD_SITE_B64}" ]; then
            printf '%s' "${DEPLOY_VALUES_PROD_SITE_B64}" | base64 -d > deploy/helm/values-prod-site.ci.yaml
          fi

      - name: Validate production profile (strict)
        run: |
          set -euo pipefail
          if [ -f deploy/helm/values-prod-site.ci.yaml ]; then
            python3 scripts/validate_production_profile.py --strict \
              -f deploy/helm/values-production.yaml \
              -f deploy/helm/values-prod-site.ci.yaml
          else
            python3 scripts/validate_production_profile.py --strict -f deploy/helm/values-production.yaml
          fi

      - name: Deploy with digest-pinned values
        run: |
          set -euo pipefail
          helm_args=(
            upgrade --install "${HELM_RELEASE_NAME}" ./deploy/helm
            --namespace "${NAMESPACE}"
            --create-namespace
            -f deploy/helm/values.yaml
            -f deploy/helm/values-production.yaml
            --wait
            --timeout 15m
          )
          if [ -f deploy/helm/values-prod-site.ci.yaml ]; then
            helm_args+=(-f deploy/helm/values-prod-site.ci.yaml)
          fi
          helm "${helm_args[@]}"

      - name: Wait for core rollout
        run: |
          set -euo pipefail
          kubectl -n "${NAMESPACE}" rollout status deployment/bretter-postgres --timeout=300s
          kubectl -n "${NAMESPACE}" rollout status deployment/bretter-backend --timeout=300s
          kubectl -n "${NAMESPACE}" rollout status deployment/bretter-frontend --timeout=300s

      - name: Run go-live proof
        run: |
          set -euo pipefail
          if [ -f deploy/helm/values-prod-site.ci.yaml ]; then
            NAMESPACE="${NAMESPACE}" SITE_VALUES_FILE="$(pwd)/deploy/helm/values-prod-site.ci.yaml" \
              ./scripts/production_go_live_proof.sh
          else
            NAMESPACE="${NAMESPACE}" REQUIRE_SITE_VALUES_FILE=0 ./scripts/production_go_live_proof.sh
          fi

      - name: Check live config drift
        run: |
          set -euo pipefail
          cmd=(python3 scripts/check_live_config_drift.py --namespace "${NAMESPACE}" -f deploy/helm/values.yaml -f deploy/helm/values-production.yaml)
          if [ -f deploy/helm/values-prod-site.ci.yaml ]; then
            cmd+=(-f deploy/helm/values-prod-site.ci.yaml)
          fi
          "${cmd[@]}" | tee /tmp/deploy-production-drift.txt

      - name: Upload deployment reports
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: deploy-production-reports
          path: |
            artifacts/go-live/
            /tmp/deploy-production-drift.txt
          if-no-files-found: warn
