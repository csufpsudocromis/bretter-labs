name: Deploy Userflow Smoke

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "27 9 * * *"

permissions:
  contents: read

jobs:
  userflow-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install backend dependencies
        run: |
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r backend/requirements-dev.txt

      - name: Run user-flow regression smoke (API)
        run: |
          PYTHONPATH=backend .venv/bin/pytest -q backend/tests/test_e2e_regressions.py -k "cookie_auth_login_me_logout or rbac_user_cannot_access_admin or oidc_start_and_callback_issue_session_cookie"

      - name: Install kind
        run: |
          curl -fsSL -o /tmp/kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind

      - name: Create kind cluster
        run: kind create cluster --name userflow-smoke --wait 120s

      - name: Run LabInstance controller smoke
        run: NAMESPACE=labs PYTHON=.venv/bin/python ./scripts/smoke_labinstance_controller.sh

      - name: Run LabImageImport controller smoke
        run: NAMESPACE=labs PYTHON=.venv/bin/python ./scripts/smoke_labimageimport_controller.sh

      - name: Run tenant isolation impersonation smoke
        run: ./scripts/smoke_tenant_isolation_impersonation.sh

      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name userflow-smoke || true
