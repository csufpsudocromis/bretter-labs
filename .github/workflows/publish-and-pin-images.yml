name: Publish Images And Pin Digests

on:
  push:
    branches:
      - main
    paths:
      - "VERSION"
      - "backend/**"
      - "frontend-vite/**"
      - "runner/**"
      - "deploy/helm/values-production.yaml"
      - "scripts/update_production_image_digests.py"
      - ".github/workflows/publish-and-pin-images.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (without leading v). Defaults to VERSION file."
        required: false
      image_namespace:
        description: "GHCR namespace (defaults to repository owner)."
        required: false
      commit_digest_update:
        description: "Commit updated digests into deploy/helm/values-production.yaml"
        required: false
        default: "true"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: publish-and-pin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    env:
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image_namespace: ${{ steps.meta.outputs.image_namespace }}
      backend_admin_ref: ${{ steps.refs.outputs.backend_admin_ref }}
      backend_runtime_ref: ${{ steps.refs.outputs.backend_runtime_ref }}
      frontend_ref: ${{ steps.refs.outputs.frontend_ref }}
      runner_ref: ${{ steps.refs.outputs.runner_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Resolve version and namespace
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version_input="${{ github.event.inputs.version }}"
          if [ -z "${version_input}" ]; then
            base_version="$(tr -d '[:space:]' < VERSION)"
            if [ "${{ github.event_name }}" = "push" ]; then
              short_sha="$(printf '%s' "${GITHUB_SHA}" | cut -c1-12)"
              version_input="${base_version}-${short_sha}"
            else
              version_input="${base_version}"
            fi
          fi
          if [[ ! "${version_input}" =~ ^[0-9]+(\.[0-9]+){2}([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid semantic version: ${version_input}" >&2
            exit 1
          fi
          namespace_input="${{ github.event.inputs.image_namespace }}"
          if [ -z "${namespace_input}" ]; then
            namespace_input="${GITHUB_REPOSITORY_OWNER}"
          fi
          if [ -z "${namespace_input}" ]; then
            echo "image namespace cannot be empty" >&2
            exit 1
          fi
          echo "version=${version_input}" >>"${GITHUB_OUTPUT}"
          echo "image_namespace=${namespace_input}" >>"${GITHUB_OUTPUT}"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to GHCR (PAT)
        if: ${{ env.GHCR_PAT != '' && env.GHCR_USERNAME != '' }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ env.GHCR_PAT }}

      - name: Login to GHCR (GITHUB_TOKEN fallback)
        if: ${{ !(env.GHCR_PAT != '' && env.GHCR_USERNAME != '') }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend/admin image
        id: backend
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: backend/Dockerfile
          target: admin-tools
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.image_namespace }}/bretter-backend:v${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.image_namespace }}/bretter-backend-admin:v${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Build and push backend runtime-only image
        id: backend_runtime
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: backend/Dockerfile
          target: runtime
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.image_namespace }}/bretter-backend-runtime:v${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Build and push frontend image
        id: frontend
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: frontend-vite/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.image_namespace }}/bretter-frontend:v${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Build and push runner image
        id: runner
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: runner
          file: runner/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.image_namespace }}/win-vm-runner:v${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Build fully-qualified release-tag+digest refs
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.version }}"
          ns="${{ steps.meta.outputs.image_namespace }}"
          backend_admin_ref="ghcr.io/${ns}/bretter-backend:v${version}@${{ steps.backend.outputs.digest }}"
          backend_runtime_ref="ghcr.io/${ns}/bretter-backend-runtime:v${version}@${{ steps.backend_runtime.outputs.digest }}"
          frontend_ref="ghcr.io/${ns}/bretter-frontend:v${version}@${{ steps.frontend.outputs.digest }}"
          runner_ref="ghcr.io/${ns}/win-vm-runner:v${version}@${{ steps.runner.outputs.digest }}"
          echo "backend_admin_ref=${backend_admin_ref}" >>"${GITHUB_OUTPUT}"
          echo "backend_runtime_ref=${backend_runtime_ref}" >>"${GITHUB_OUTPUT}"
          echo "frontend_ref=${frontend_ref}" >>"${GITHUB_OUTPUT}"
          echo "runner_ref=${runner_ref}" >>"${GITHUB_OUTPUT}"
          cat <<REFS
          ${backend_admin_ref}
          ${backend_runtime_ref}
          ${frontend_ref}
          ${runner_ref}
          REFS

  scan:
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Scan backend admin image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ needs.publish.outputs.backend_admin_ref }}
          scanners: vuln
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Scan backend runtime image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ needs.publish.outputs.backend_runtime_ref }}
          scanners: vuln
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ needs.publish.outputs.frontend_ref }}
          scanners: vuln
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Scan runner image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ needs.publish.outputs.runner_ref }}
          scanners: vuln
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"

  sign_verify:
    runs-on: ubuntu-latest
    needs:
      - publish
      - scan
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Sign published images (keyless)
        shell: bash
        run: |
          set -euo pipefail
          refs=(
            "${{ needs.publish.outputs.backend_admin_ref }}"
            "${{ needs.publish.outputs.backend_runtime_ref }}"
            "${{ needs.publish.outputs.frontend_ref }}"
            "${{ needs.publish.outputs.runner_ref }}"
          )
          for ref in "${refs[@]}"; do
            cosign sign --yes "${ref}"
          done

      - name: Verify image signatures
        shell: bash
        run: |
          set -euo pipefail
          refs=(
            "${{ needs.publish.outputs.backend_admin_ref }}"
            "${{ needs.publish.outputs.backend_runtime_ref }}"
            "${{ needs.publish.outputs.frontend_ref }}"
            "${{ needs.publish.outputs.runner_ref }}"
          )
          for ref in "${refs[@]}"; do
            cosign verify \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --certificate-identity-regexp '^https://github.com/.+/.+/.github/workflows/.+@refs/heads/.+$' \
              "${ref}" >/dev/null
          done

  promote:
    runs-on: ubuntu-latest
    needs:
      - publish
      - scan
      - sign_verify
    if: ${{ github.event.inputs.commit_digest_update != 'false' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Update production digest pins
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/update_production_image_digests.py \
            --values-file deploy/helm/values-production.yaml \
            --backend-image "${{ needs.publish.outputs.backend_runtime_ref }}" \
            --backend-admin-image "${{ needs.publish.outputs.backend_admin_ref }}" \
            --frontend-image "${{ needs.publish.outputs.frontend_ref }}" \
            --runner-image "${{ needs.publish.outputs.runner_ref }}"

          if git diff --quiet -- deploy/helm/values-production.yaml; then
            echo "No digest pin changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/helm/values-production.yaml
          git commit -m "chore(release): pin production image digests for v${{ needs.publish.outputs.version }}"
          git push
