name: Publish Images And Pin Digests

on:
  push:
    branches:
      - main
    paths:
      - "VERSION"
      - "backend/**"
      - "frontend-vite/**"
      - "runner/**"
      - "deploy/helm/values-production.yaml"
      - "scripts/update_production_image_digests.py"
      - ".github/workflows/publish-and-pin-images.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (without leading v). Defaults to VERSION file."
        required: false
      image_namespace:
        description: "GHCR namespace (defaults to repository owner)."
        required: false
      commit_digest_update:
        description: "Commit updated digests into deploy/helm/values-production.yaml"
        required: false
        default: "true"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: publish-and-pin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    env:
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image_namespace: ${{ steps.meta.outputs.image_namespace }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Resolve version and namespace
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version_input="${{ github.event.inputs.version }}"
          if [ -z "${version_input}" ]; then
            base_version="$(tr -d '[:space:]' < VERSION)"
            if [ "${{ github.event_name }}" = "push" ]; then
              short_sha="$(printf '%s' "${GITHUB_SHA}" | cut -c1-12)"
              version_input="${base_version}-${short_sha}"
            else
              version_input="${base_version}"
            fi
          fi
          if [[ ! "${version_input}" =~ ^[0-9]+(\.[0-9]+){2}([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid semantic version: ${version_input}" >&2
            exit 1
          fi
          namespace_input="${{ github.event.inputs.image_namespace }}"
          if [ -z "${namespace_input}" ]; then
            namespace_input="${GITHUB_REPOSITORY_OWNER}"
          fi
          if [ -z "${namespace_input}" ]; then
            echo "image namespace cannot be empty" >&2
            exit 1
          fi
          echo "version=${version_input}" >>"${GITHUB_OUTPUT}"
          echo "image_namespace=${namespace_input}" >>"${GITHUB_OUTPUT}"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR (PAT)
        if: ${{ env.GHCR_PAT != '' && env.GHCR_USERNAME != '' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ env.GHCR_PAT }}

      - name: Login to GHCR (GITHUB_TOKEN fallback)
        if: ${{ !(env.GHCR_PAT != '' && env.GHCR_USERNAME != '') }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend/admin image
        id: backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: backend/Dockerfile
          target: admin-tools
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.image_namespace }}/bretter-backend:v${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.image_namespace }}/bretter-backend-admin:v${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Build and push backend runtime-only image
        id: backend_runtime
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: backend/Dockerfile
          target: runtime
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.image_namespace }}/bretter-backend-runtime:v${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Build and push frontend image
        id: frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: frontend-vite/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.image_namespace }}/bretter-frontend:v${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Build and push runner image
        id: runner
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: runner
          file: runner/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.image_namespace }}/win-vm-runner:v${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Build fully-qualified release-tag+digest refs
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.version }}"
          ns="${{ steps.meta.outputs.image_namespace }}"
          backend_admin_ref="ghcr.io/${ns}/bretter-backend:v${version}@${{ steps.backend.outputs.digest }}"
          backend_runtime_ref="ghcr.io/${ns}/bretter-backend-runtime:v${version}@${{ steps.backend_runtime.outputs.digest }}"
          frontend_ref="ghcr.io/${ns}/bretter-frontend:v${version}@${{ steps.frontend.outputs.digest }}"
          runner_ref="ghcr.io/${ns}/win-vm-runner:v${version}@${{ steps.runner.outputs.digest }}"
          mkdir -p .ci
          cat > .ci/image-refs.env <<EOF
          BACKEND_ADMIN_REF=${backend_admin_ref}
          BACKEND_RUNTIME_REF=${backend_runtime_ref}
          FRONTEND_REF=${frontend_ref}
          RUNNER_REF=${runner_ref}
          EOF
          cat .ci/image-refs.env

      - name: Upload image refs artifact
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: published-image-refs
          path: .ci/image-refs.env
          if-no-files-found: error

  scan:
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Download image refs artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: published-image-refs

      - name: Load image refs
        shell: bash
        run: |
          set -euo pipefail
          [ -f image-refs.env ] || { echo "missing image-refs.env artifact" >&2; exit 1; }
          # shellcheck disable=SC1091
          . ./image-refs.env
          for key in BACKEND_ADMIN_REF BACKEND_RUNTIME_REF FRONTEND_REF RUNNER_REF; do
            [ -n "${!key:-}" ] || { echo "missing ${key} in image refs artifact" >&2; exit 1; }
          done
          {
            echo "BACKEND_ADMIN_REF=${BACKEND_ADMIN_REF}"
            echo "BACKEND_RUNTIME_REF=${BACKEND_RUNTIME_REF}"
            echo "FRONTEND_REF=${FRONTEND_REF}"
            echo "RUNNER_REF=${RUNNER_REF}"
          } >>"${GITHUB_ENV}"

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@e6c2c5e321ed9123bda567646e2f96565e34abe1 # v0.2.4

      - name: Scan published images with Trivy
        shell: bash
        run: |
          set -euo pipefail
          refs=(
            "${BACKEND_ADMIN_REF}"
            "${BACKEND_RUNTIME_REF}"
            "${FRONTEND_REF}"
            "${RUNNER_REF}"
          )
          for ref in "${refs[@]}"; do
            echo "Scanning ${ref}"
            trivy image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 "${ref}"
          done

  sign_verify:
    runs-on: ubuntu-latest
    needs:
      - publish
      - scan
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Download image refs artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: published-image-refs

      - name: Load image refs
        shell: bash
        run: |
          set -euo pipefail
          [ -f image-refs.env ] || { echo "missing image-refs.env artifact" >&2; exit 1; }
          # shellcheck disable=SC1091
          . ./image-refs.env
          for key in BACKEND_ADMIN_REF BACKEND_RUNTIME_REF FRONTEND_REF RUNNER_REF; do
            [ -n "${!key:-}" ] || { echo "missing ${key} in image refs artifact" >&2; exit 1; }
          done
          {
            echo "BACKEND_ADMIN_REF=${BACKEND_ADMIN_REF}"
            echo "BACKEND_RUNTIME_REF=${BACKEND_RUNTIME_REF}"
            echo "FRONTEND_REF=${FRONTEND_REF}"
            echo "RUNNER_REF=${RUNNER_REF}"
          } >>"${GITHUB_ENV}"

      - name: Install cosign
        uses: sigstore/cosign-installer@1aa8e0f2454b781fbf0fbf306a4c9533a0c57409 # v3.7.0

      - name: Sign published images (keyless)
        shell: bash
        run: |
          set -euo pipefail
          refs=(
            "${BACKEND_ADMIN_REF}"
            "${BACKEND_RUNTIME_REF}"
            "${FRONTEND_REF}"
            "${RUNNER_REF}"
          )
          for ref in "${refs[@]}"; do
            cosign sign --yes "${ref}"
          done

      - name: Verify image signatures
        shell: bash
        run: |
          set -euo pipefail
          refs=(
            "${BACKEND_ADMIN_REF}"
            "${BACKEND_RUNTIME_REF}"
            "${FRONTEND_REF}"
            "${RUNNER_REF}"
          )
          for ref in "${refs[@]}"; do
            cosign verify \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --certificate-identity-regexp '^https://github.com/.+/.+/.github/workflows/.+@refs/heads/.+$' \
              "${ref}" >/dev/null
          done

  promote:
    runs-on: ubuntu-latest
    needs:
      - publish
      - scan
      - sign_verify
    if: ${{ github.event.inputs.commit_digest_update != 'false' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Download image refs artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: published-image-refs

      - name: Load image refs
        shell: bash
        run: |
          set -euo pipefail
          [ -f image-refs.env ] || { echo "missing image-refs.env artifact" >&2; exit 1; }
          # shellcheck disable=SC1091
          . ./image-refs.env
          for key in BACKEND_ADMIN_REF BACKEND_RUNTIME_REF FRONTEND_REF RUNNER_REF; do
            [ -n "${!key:-}" ] || { echo "missing ${key} in image refs artifact" >&2; exit 1; }
          done
          {
            echo "BACKEND_ADMIN_REF=${BACKEND_ADMIN_REF}"
            echo "BACKEND_RUNTIME_REF=${BACKEND_RUNTIME_REF}"
            echo "FRONTEND_REF=${FRONTEND_REF}"
            echo "RUNNER_REF=${RUNNER_REF}"
          } >>"${GITHUB_ENV}"

      - name: Update production digest pins
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/update_production_image_digests.py \
            --values-file deploy/helm/values-production.yaml \
            --backend-image "${BACKEND_RUNTIME_REF}" \
            --backend-admin-image "${BACKEND_ADMIN_REF}" \
            --frontend-image "${FRONTEND_REF}" \
            --runner-image "${RUNNER_REF}"

          if git diff --quiet -- deploy/helm/values-production.yaml; then
            echo "No digest pin changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/helm/values-production.yaml
          git commit -m "chore(release): pin production image digests for v${{ needs.publish.outputs.version }}"
          git push
