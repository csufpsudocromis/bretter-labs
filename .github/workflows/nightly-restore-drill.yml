name: Nightly Restore Drill

on:
  pull_request:
    branches:
      - "release/**"
  push:
    branches:
      - "release/**"
  workflow_dispatch:
    inputs:
      namespace:
        description: "Kubernetes namespace to run restore drill in"
        required: false
        default: "labs"
      require_backup_cronjob:
        description: "Fail when backup CronJob is missing (true/false)"
        required: false
        default: "true"
      run_clean_namespace_restore_drill:
        description: "Run clean-namespace restore verification (true/false)"
        required: false
        default: "true"
  schedule:
    - cron: "42 9 * * *"

permissions:
  contents: read

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    env:
      NAMESPACE: ${{ github.event.inputs.namespace || 'labs' }}
      REQUIRE_BACKUP_CRONJOB: ${{ github.event.inputs.require_backup_cronjob || 'true' }}
      RUN_CLEAN_NAMESPACE_RESTORE_DRILL: ${{ github.event.inputs.run_clean_namespace_restore_drill || 'true' }}
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup kubeconfig
        run: |
          set -euo pipefail
          [ -n "${KUBECONFIG_B64}" ] || { echo "KUBECONFIG_B64 secret is required." >&2; exit 1; }
          mkdir -p "${HOME}/.kube"
          printf '%s' "${KUBECONFIG_B64}" | base64 -d >"${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"
          kubectl version --client
          kubectl -n "${NAMESPACE}" get deploy bretter-postgres >/dev/null

      - name: Run postgres restore drill
        run: |
          set -euo pipefail
          NAMESPACE="${NAMESPACE}" ./scripts/restore_drill_postgres.sh

      - name: Run clean-namespace restore drill
        run: |
          set -euo pipefail
          should_run=0
          case "$(printf '%s' "${RUN_CLEAN_NAMESPACE_RESTORE_DRILL}" | tr '[:upper:]' '[:lower:]')" in
            1 | true | yes | on) should_run=1 ;;
            *) should_run=0 ;;
          esac
          if [ "$should_run" -eq 1 ]; then
            SOURCE_NAMESPACE="${NAMESPACE}" ./scripts/restore_drill_clean_namespace.sh
          else
            echo "Skipping clean-namespace restore drill (RUN_CLEAN_NAMESPACE_RESTORE_DRILL=${RUN_CLEAN_NAMESPACE_RESTORE_DRILL})."
          fi

      - name: Validate backup retention policy
        run: |
          set -euo pipefail
          require_flag=0
          case "$(printf '%s' "${REQUIRE_BACKUP_CRONJOB}" | tr '[:upper:]' '[:lower:]')" in
            1 | true | yes | on) require_flag=1 ;;
            *) require_flag=0 ;;
          esac
          NAMESPACE="${NAMESPACE}" REQUIRE_BACKUP_CRONJOB="${require_flag}" ./scripts/validate_backup_retention.sh

      - name: Upload restore-drill report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-restore-drill-report
          path: |
            artifacts/restore-drill/
            artifacts/restore-drill-clean-namespace/
            artifacts/backup-retention/
          if-no-files-found: warn
