name: CI Guardrails

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install shellcheck and shfmt
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt

      - name: Run shellcheck
        run: shellcheck scripts/setup.sh scripts/ci_guardrails.sh scripts/smoke_setup.sh scripts/smoke_tls_login.sh scripts/smoke_labinstance_controller.sh scripts/smoke_labimageimport_controller.sh scripts/smoke_tenant_isolation_impersonation.sh scripts/production_go_live_proof.sh scripts/crd_canary_labinstance.sh scripts/restore_drill_postgres.sh scripts/restore_drill_clean_namespace.sh scripts/validate_backup_retention.sh scripts/failure_drill_control_plane.sh scripts/bootstrap_team_namespace.sh scripts/rollback_release.sh scripts/deploy_production_safe.sh scripts/check_alembic_postgres.sh scripts/audit_tenant_isolation.sh scripts/apply_dev_signature_exception.sh scripts/apply_branch_protection.sh scripts/check_branch_protection.sh scripts/diagnose_connectivity.sh frontend-vite/nginx-entrypoint.sh

      - name: Run shfmt
        run: shfmt -d -i 2 -ci scripts/ci_guardrails.sh scripts/smoke_setup.sh scripts/smoke_tls_login.sh scripts/smoke_labinstance_controller.sh scripts/smoke_labimageimport_controller.sh scripts/smoke_tenant_isolation_impersonation.sh scripts/production_go_live_proof.sh scripts/crd_canary_labinstance.sh scripts/restore_drill_postgres.sh scripts/restore_drill_clean_namespace.sh scripts/validate_backup_retention.sh scripts/failure_drill_control_plane.sh scripts/bootstrap_team_namespace.sh scripts/rollback_release.sh scripts/deploy_production_safe.sh scripts/check_alembic_postgres.sh scripts/audit_tenant_isolation.sh scripts/apply_dev_signature_exception.sh scripts/apply_branch_protection.sh scripts/check_branch_protection.sh scripts/diagnose_connectivity.sh backend/entrypoint.sh frontend-vite/nginx-entrypoint.sh

      - name: Run hadolint
        run: |
          docker run --rm -i hadolint/hadolint hadolint --failure-threshold error - < backend/Dockerfile
          docker run --rm -i hadolint/hadolint hadolint --failure-threshold error - < frontend-vite/Dockerfile
          docker run --rm -i hadolint/hadolint hadolint --failure-threshold error - < runner/Dockerfile

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@e6c2c5e321ed9123bda567646e2f96565e34abe1 # v0.2.4

      - name: Run Trivy filesystem scan
        run: |
          trivy fs \
            --scanners vuln \
            --skip-dirs .venv,frontend-vite/node_modules \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            .

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.15.4

      - name: Validate Helm chart rendering
        run: |
          helm lint ./deploy/helm
          helm template bretter-labs ./deploy/helm -f deploy/helm/values.yaml >/tmp/helm-values.yaml
          helm template bretter-labs ./deploy/helm -f deploy/helm/values.yaml -f deploy/helm/values-production.yaml >/tmp/helm-values-production.yaml
          kubectl kustomize deploy/crds >/tmp/crds-rendered.yaml

      - name: Run tenant isolation audit
        run: ./scripts/audit_tenant_isolation.sh

      - name: Setup kind for CRD server-side dry-run
        run: |
          curl -fsSL -o /tmp/kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          kind create cluster --name crd-check --wait 120s

      - name: Validate CRDs (schema lint + server dry-run)
        run: |
          kubectl apply --dry-run=server -k deploy/crds

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install backend dependencies
        run: |
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r backend/requirements-dev.txt
          .venv/bin/python -c "import httpx; from fastapi.testclient import TestClient"

      - name: Validate Alembic upgrades on PostgreSQL
        env:
          ALEMBIC_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/bretter_ci_gate
          ALEMBIC_POSTGRES_ADMIN_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
          ALEMBIC_POSTGRES_WAIT_SECONDS: "90"
        run: ./scripts/check_alembic_postgres.sh

      - name: Check Python formatting
        run: .venv/bin/black --check backend/src backend/tests scripts/check_release_discipline.py scripts/bump_version.py scripts/validate_production_profile.py scripts/update_production_image_digests.py scripts/backfill_labinstances_from_db.py scripts/lint_crd_schema.py scripts/check_no_plaintext_tokens.py scripts/check_openapi_drift.py scripts/export_openapi_schema.py scripts/post_deploy_synthetic_check.py scripts/check_live_config_drift.py scripts/namespace_config_backup.py

      - name: Run namespace authz regression gate
        run: |
          PYTHONPATH=backend .venv/bin/pytest -q \
            backend/tests/test_namespace_authz_matrix.py \
            backend/tests/test_namespace_scoping.py

      - name: Run pip-audit
        run: |
          .venv/bin/pip install pip-audit
          .venv/bin/pip-audit -r backend/requirements.txt

      - name: Run release/version guardrail
        run: .venv/bin/python scripts/check_release_discipline.py

      - name: Run plaintext token guardrail
        run: .venv/bin/python scripts/check_no_plaintext_tokens.py --history

      - name: Validate OpenAPI snapshot drift
        run: .venv/bin/python scripts/check_openapi_drift.py

      - name: Validate production profile (strict gate)
        run: .venv/bin/python scripts/validate_production_profile.py --strict -f deploy/helm/values-production.yaml

      - name: Run LabInstance controller smoke (kind, dry-run)
        run: NAMESPACE=labs PYTHON=.venv/bin/python ./scripts/smoke_labinstance_controller.sh

      - name: Run LabInstance controller smoke (kind, CRD mode)
        run: NAMESPACE=labs PYTHON=.venv/bin/python BLABS_ORCHESTRATION_BACKEND=crd ./scripts/smoke_labinstance_controller.sh

      - name: Run LabImageImport controller smoke (kind)
        run: NAMESPACE=labs PYTHON=.venv/bin/python ./scripts/smoke_labimageimport_controller.sh

      - name: Run tenant isolation impersonation smoke (kind)
        run: ./scripts/smoke_tenant_isolation_impersonation.sh

      - name: Run CI guardrails
        run: ./scripts/ci_guardrails.sh

      - name: Teardown kind cluster
        if: always()
        run: kind delete cluster --name crd-check || true

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-vite/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend-vite ci

      - name: Check frontend API types drift
        run: |
          npm --prefix frontend-vite run generate:api-types
          git diff --exit-code -- frontend-vite/src/api/openapi-types.d.ts

      - name: Run frontend tests
        run: npm --prefix frontend-vite run test

      - name: Lint frontend
        run: npm --prefix frontend-vite run lint

      - name: Check frontend formatting
        run: npm --prefix frontend-vite run format:check

      - name: Build frontend
        run: npm --prefix frontend-vite run build

      - name: Run npm audit (production deps)
        run: npm --prefix frontend-vite audit --omit=dev --audit-level=high
