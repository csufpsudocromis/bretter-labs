name: CI Guardrails

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck and shfmt
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt

      - name: Run shellcheck
        run: shellcheck scripts/setup.sh scripts/ci_guardrails.sh scripts/smoke_setup.sh scripts/smoke_tls_login.sh scripts/smoke_labinstance_controller.sh scripts/production_go_live_proof.sh scripts/crd_canary_labinstance.sh scripts/rollback_release.sh frontend-vite/nginx-entrypoint.sh

      - name: Run shfmt
        run: shfmt -d -i 2 -ci scripts/ci_guardrails.sh scripts/smoke_setup.sh scripts/smoke_tls_login.sh scripts/smoke_labinstance_controller.sh scripts/production_go_live_proof.sh scripts/crd_canary_labinstance.sh scripts/rollback_release.sh backend/entrypoint.sh frontend-vite/nginx-entrypoint.sh

      - name: Run hadolint
        run: |
          docker run --rm -i hadolint/hadolint hadolint --failure-threshold error - < backend/Dockerfile
          docker run --rm -i hadolint/hadolint hadolint --failure-threshold error - < frontend-vite/Dockerfile
          docker run --rm -i hadolint/hadolint hadolint --failure-threshold error - < runner/Dockerfile

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          skip-dirs: .venv,frontend-vite/node_modules
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Validate Helm chart rendering
        run: |
          helm lint ./deploy/helm
          helm template bretter-labs ./deploy/helm -f deploy/helm/values.yaml >/tmp/helm-values.yaml
          helm template bretter-labs ./deploy/helm -f deploy/helm/values.yaml -f deploy/helm/values-production.yaml >/tmp/helm-values-production.yaml
          kubectl kustomize deploy/crds >/tmp/crds-rendered.yaml

      - name: Setup kind for CRD server-side dry-run
        run: |
          curl -fsSL -o /tmp/kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          kind create cluster --name crd-check --wait 120s

      - name: Validate CRDs (schema lint + server dry-run)
        run: |
          kubectl apply --dry-run=server -k deploy/crds

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install backend dependencies
        run: |
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r backend/requirements-dev.txt
          .venv/bin/python -c "import httpx; from fastapi.testclient import TestClient"

      - name: Check Python formatting
        run: .venv/bin/black --check backend/src backend/tests scripts/check_release_discipline.py scripts/bump_version.py scripts/validate_production_profile.py scripts/update_production_image_digests.py scripts/backfill_labinstances_from_db.py scripts/lint_crd_schema.py scripts/check_no_plaintext_tokens.py

      - name: Run pip-audit
        run: |
          .venv/bin/pip install pip-audit
          .venv/bin/pip-audit -r backend/requirements.txt

      - name: Run release/version guardrail
        run: .venv/bin/python scripts/check_release_discipline.py

      - name: Run plaintext token guardrail
        run: .venv/bin/python scripts/check_no_plaintext_tokens.py

      - name: Validate production profile (strict gate)
        run: .venv/bin/python scripts/validate_production_profile.py --strict -f deploy/helm/values-production.yaml

      - name: Run LabInstance controller smoke (kind, dry-run)
        run: NAMESPACE=labs PYTHON=.venv/bin/python ./scripts/smoke_labinstance_controller.sh

      - name: Run CI guardrails
        run: ./scripts/ci_guardrails.sh

      - name: Teardown kind cluster
        if: always()
        run: kind delete cluster --name crd-check || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-vite/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend-vite ci

      - name: Run frontend tests
        run: npm --prefix frontend-vite run test

      - name: Lint frontend
        run: npm --prefix frontend-vite run lint

      - name: Check frontend formatting
        run: npm --prefix frontend-vite run format:check

      - name: Build frontend
        run: npm --prefix frontend-vite run build

      - name: Run npm audit (production deps)
        run: npm --prefix frontend-vite audit --omit=dev --audit-level=high
