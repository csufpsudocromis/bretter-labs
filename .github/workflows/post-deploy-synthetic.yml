name: Post-Deploy Synthetic Check

on:
  pull_request:
    branches:
      - main
      - "release/**"
  push:
    branches:
      - main
      - "release/**"
  workflow_dispatch:
    inputs:
      api_base:
        description: "Base API URL (for example https://labs.example.com/api). Leave empty to use secret."
        required: false
      verify_tls:
        description: "Verify TLS certificates (true/false)"
        required: false
        default: "true"
      require_templates:
        description: "Fail when VM/container templates are missing (true/false)"
        required: false
        default: "true"
      require_rdp_template:
        description: "Fail when no guacamole_rdp template is available (true/false)"
        required: false
        default: "true"
      timeout_seconds:
        description: "Total timeout budget in seconds"
        required: false
        default: "900"
  schedule:
    - cron: "19 10 * * *"

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-latest
    env:
      SYNTHETIC_API_BASE: ${{ github.event.inputs.api_base || secrets.SYNTHETIC_API_BASE }}
      SYNTHETIC_USERNAME: ${{ secrets.SYNTHETIC_USERNAME }}
      SYNTHETIC_PASSWORD: ${{ secrets.SYNTHETIC_PASSWORD }}
      SYNTHETIC_VERIFY_TLS: ${{ github.event.inputs.verify_tls || 'true' }}
      SYNTHETIC_REQUIRE_TEMPLATES: ${{ github.event.inputs.require_templates || 'true' }}
      SYNTHETIC_REQUIRE_RDP_TEMPLATE: ${{ github.event.inputs.require_rdp_template || 'true' }}
      SYNTHETIC_TIMEOUT_SECONDS: ${{ github.event.inputs.timeout_seconds || '900' }}
      SYNTHETIC_POLL_SECONDS: "3"
      SYNTHETIC_RDP_MARKER_TIMEOUT_SECONDS: "180"
      SYNTHETIC_RUN_NAMESPACE_SWITCH_PROBE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install --upgrade pip requests

      - name: Validate required secrets
        run: |
          set -euo pipefail
          [ -n "${SYNTHETIC_API_BASE}" ] || { echo "SYNTHETIC_API_BASE is required (input or secret)." >&2; exit 1; }
          [ -n "${SYNTHETIC_USERNAME}" ] || { echo "SYNTHETIC_USERNAME secret is required." >&2; exit 1; }
          [ -n "${SYNTHETIC_PASSWORD}" ] || { echo "SYNTHETIC_PASSWORD secret is required." >&2; exit 1; }

      - name: Run post-deploy synthetic check
        run: |
          set -euo pipefail
          python scripts/post_deploy_synthetic_check.py | tee post-deploy-synthetic-report.txt

      - name: Upload synthetic report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: post-deploy-synthetic-report
          path: post-deploy-synthetic-report.txt
