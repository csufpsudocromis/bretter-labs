apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: labinstances.labs.bretter.io
spec:
  group: labs.bretter.io
  scope: Namespaced
  names:
    plural: labinstances
    singular: labinstance
    kind: LabInstance
    shortNames:
      - labi
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - owner
                - templateRef
                - workload
              properties:
                owner:
                  type: object
                  required:
                    - username
                  properties:
                    username:
                      type: string
                      minLength: 1
                templateRef:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                      minLength: 1
                workload:
                  type: object
                  required:
                    - kind
                  properties:
                    kind:
                      type: string
                      enum:
                        - vm
                        - container
                    consoleProvider:
                      type: string
                      enum:
                        - spice
                        - guacamole_vnc
                        - guacamole_rdp
                resources:
                  type: object
                  properties:
                    cpuMillicores:
                      type: integer
                      minimum: 100
                    memoryMiB:
                      type: integer
                      minimum: 128
                    diskGiB:
                      type: integer
                      minimum: 1
                network:
                  type: object
                  properties:
                    mode:
                      type: string
                      minLength: 1
                idleTimeoutMinutes:
                  type: integer
                  minimum: 1
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                phase:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                runtime:
                  type: object
                  properties:
                    podName:
                      type: string
                    serviceName:
                      type: string
                    connectEndpoint:
                      type: string
                failure:
                  type: object
                  properties:
                    code:
                      type: string
                    message:
                      type: string
      additionalPrinterColumns:
        - name: Owner
          type: string
          jsonPath: .spec.owner.username
        - name: Template
          type: string
          jsonPath: .spec.templateRef.name
        - name: Kind
          type: string
          jsonPath: .spec.workload.kind
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
