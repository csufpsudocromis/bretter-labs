apiVersion: v1
kind: ServiceAccount
metadata:
  name: bretter-backend
  namespace: __NAMESPACE__
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bretter-backend
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec", "services", "namespaces", "nodes", "persistentvolumeclaims", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bretter-backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bretter-backend
subjects:
  - kind: ServiceAccount
    name: bretter-backend
    namespace: __NAMESPACE__
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: backend-data-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: backend-data-sc
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  hostPath:
    path: __BACKEND_DATA_HOSTPATH__
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - __CONTROL_NODE__
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-data
  namespace: __NAMESPACE__
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: backend-data-sc
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bretter-backend
  namespace: __NAMESPACE__
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: bretter-backend
  template:
    metadata:
      labels:
        app: bretter-backend
    spec:
      nodeSelector:
        kubernetes.io/hostname: __CONTROL_NODE__
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      serviceAccountName: bretter-backend
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: backend
          image: __BACKEND_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: BLABS_KUBE_NAMESPACE
              value: __NAMESPACE__
            - name: BLABS_KUBE_IMAGE_PVC
              value: golden-images
            - name: BLABS_STORAGE_ROOT
              value: /mnt/lab-images
            - name: BLABS_DATABASE_PATH
              value: /data/app.db
            - name: BLABS_KUBE_NODE_EXTERNAL_HOST
              value: __NODE_EXTERNAL_HOST__
            - name: BLABS_PUBLIC_SCHEME
              value: __PUBLIC_SCHEME__
            - name: BLABS_KUBE_TLS_SECRET
              value: __TLS_SECRET_NAME__
            - name: BLABS_KUBE_NODE_SELECTOR_VALUE
              value: __CONTROL_NODE__
            - name: BLABS_RUNNER_IMAGE
              value: __RUNNER_IMAGE__
            - name: BLABS_IMAGE_PULL_SECRET
              value: ghcr-creds
          volumeMounts:
            - name: images
              mountPath: /mnt/lab-images
            - name: data
              mountPath: /data
            - name: tls-cert
              mountPath: /tls
              readOnly: true
      volumes:
        - name: images
          persistentVolumeClaim:
            claimName: golden-images
        - name: data
          persistentVolumeClaim:
            claimName: backend-data
        - name: tls-cert
          secret:
            secretName: __TLS_SECRET_NAME__
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: bretter-backend
  namespace: __NAMESPACE__
spec:
  type: NodePort
  selector:
    app: bretter-backend
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bretter-frontend
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bretter-frontend
  template:
    metadata:
      labels:
        app: bretter-frontend
    spec:
      nodeSelector:
        kubernetes.io/hostname: __CONTROL_NODE__
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: frontend
          image: __FRONTEND_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 443
          volumeMounts:
            - name: tls-cert
              mountPath: /tls
              readOnly: true
      volumes:
        - name: tls-cert
          secret:
            secretName: __TLS_SECRET_NAME__
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: bretter-frontend
  namespace: __NAMESPACE__
spec:
  type: NodePort
  selector:
    app: bretter-frontend
  ports:
    - port: 443
      targetPort: 443
      nodePort: 30073
