apiVersion: v1
kind: Service
metadata:
  name: bretter-backend
  namespace: __NAMESPACE__
spec:
  type: NodePort
  selector:
    app: bretter-backend
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bretter-frontend
  namespace: __NAMESPACE__
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  replicas: 2
  selector:
    matchLabels:
      app: bretter-frontend
  template:
    metadata:
      labels:
        app: bretter-frontend
        security.bretter-labs.io/enforce-admission: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: bretter-frontend
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: bretter-frontend
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: frontend
          image: __FRONTEND_IMAGE__
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8443
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 1Gi
          startupProbe:
            tcpSocket:
              port: 8443
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 8443
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8443
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: tls-cert
              mountPath: /tls
              readOnly: true
      volumes:
        - name: tls-cert
          secret:
            secretName: __TLS_SECRET_NAME__
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: bretter-frontend
  namespace: __NAMESPACE__
spec:
  type: NodePort
  selector:
    app: bretter-frontend
  ports:
    - port: 443
      targetPort: 8443
      nodePort: 30073
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bretter-default-deny-ingress
  namespace: __NAMESPACE__
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bretter-backend-allow-ingress
  namespace: __NAMESPACE__
spec:
  podSelector:
    matchLabels:
      app: bretter-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: __NAMESPACE__
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bretter-frontend-allow-ingress
  namespace: __NAMESPACE__
spec:
  podSelector:
    matchLabels:
      app: bretter-frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bretter-frontend-restrict-egress
  namespace: __NAMESPACE__
spec:
  podSelector:
    matchLabels:
      app: bretter-frontend
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: bretter-backend
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bretter-backend-restrict-egress
  namespace: __NAMESPACE__
spec:
  podSelector:
    matchLabels:
      app: bretter-backend
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: bretter-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
