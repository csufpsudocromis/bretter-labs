            - name: BLABS_AUTH_LOGIN_LOCKOUT_SECONDS
              value: "__AUTH_LOGIN_LOCKOUT_SECONDS__"
            - name: BLABS_VM_CONNECT_INSECURE_TLS
              value: "__VM_CONNECT_INSECURE_TLS__"
            - name: BLABS_CONTAINER_CONNECT_INSECURE_TLS
