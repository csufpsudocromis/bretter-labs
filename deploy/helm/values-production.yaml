# Bretter Labs production reference values.
# This file is a baseline for Helm-managed deployments.
# Adjust hostnames, storage classes, and secret references for each environment.

appTemplateValues:
  CONTROL_NODE: cbekube1
  NODE_EXTERNAL_HOST: 10.68.49.250
  RUNNER_NODE_SELECTOR_VALUE: ""
  VM_STORAGE_CLASS: longhorn-r1
  BACKEND_IMAGE: ghcr.io/csufpsudocromis/bretter-backend:latest
  FRONTEND_IMAGE: ghcr.io/csufpsudocromis/bretter-frontend:latest
  RUNNER_IMAGE: ghcr.io/csufpsudocromis/win-vm-runner:latest
  PUBLIC_SCHEME: https
  TLS_SECRET_NAME: bretter-tls
  WINDOWS_MACHINE_TYPE: q35
  WINDOWS_EFI_ENABLED: "true"
  WINDOWS_CPU_MODEL: host
  LINUX_MACHINE_TYPE: pc
  LINUX_EFI_ENABLED: "false"
  LINUX_CPU_MODEL: host
  VM_NET_BACKEND: user
  VM_RUNNER_PRIVILEGED: "0"
  VM_CONSOLE_EXTERNAL_TRAFFIC_POLICY: Local
  VM_CONSOLE_SOURCE_CIDRS: ""
  VM_CONSOLE_TICKET_LENGTH: "24"
  CONTAINER_INGRESS_ENABLED: "0"
  CONTAINER_INGRESS_CLASS: ""
  CONTAINER_INGRESS_BASE_DOMAIN: ""
  CONTAINER_INGRESS_ANNOTATIONS_JSON: "{}"
  CONTAINER_IMAGE_PREPULL_ENABLED: "1"
  CONTAINER_IMAGE_PREPULL_TIMEOUT_SECONDS: "45"
  CONTAINER_ALLOWED_REGISTRIES: docker.io,ghcr.io,quay.io,mcr.microsoft.com,gcr.io,registry.k8s.io,lscr.io
  CONTAINER_SIGNATURE_VERIFICATION_ENABLED: "0"
  CONTAINER_SIGNATURE_KEY_REF: ""
  CONTAINER_SCAN_ENABLED: "1"
  CONTAINER_SCAN_INTERVAL_MINUTES: "360"
  CONTAINER_SCAN_SEVERITY: HIGH,CRITICAL
  CONTAINER_START_QUEUE_ENABLED: "1"
  CONTAINER_START_QUEUE_BASE_DELAY_SECONDS: "20"
  CONTAINER_START_QUEUE_MAX_DELAY_SECONDS: "300"
  BACKEND_DATA_HOSTPATH: /var/lib/bretter-labs/backend-data
  GOLDEN_IMAGES_HOSTPATH: /var/lib/bretter-labs/golden-images
  POSTGRES_DATA_HOSTPATH: /var/lib/bretter-labs/postgres-data
  CDI_UPLOAD_PROXY_URL: ""

global:
  namespace: labs
  appVersion: "0.3.1"
  publicScheme: https

ingress:
  enabled: true
  className: nginx
  host: labs.fullerton.edu
  tls:
    enabled: true
    secretName: bretter-tls
  websocket:
    readTimeoutSeconds: 3600
    sendTimeoutSeconds: 3600
  mtls:
    enabled: false
    clientCaSecretName: ""

cors:
  allowedOrigins:
    - "https://labs.fullerton.edu"
    - "https://10.68.49.250:30073"
  allowedOriginRegex: "^https://([A-Za-z0-9-]+\\.)*fullerton\\.edu(:[0-9]+)?$"

auth:
  cookie:
    secure: true
    sameSite: lax
    ttlSeconds: 86400
  connect:
    grantTtlSeconds: 120
    sessionTtlSeconds: 3600

frontend:
  replicas: 2
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

backend:
  replicas: 2
  serviceAccount:
    create: true
    name: bretter-backend
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  probes:
    startup:
      enabled: true
    readiness:
      enabled: true
    liveness:
      enabled: true
  env:
    BLABS_API_DOCS_ENABLED: "0"
    BLABS_AUTH_COOKIE_SECURE: "1"
    BLABS_CONNECT_COOKIE_SECURE: "1"
    BLABS_PUBLIC_SCHEME: "https"
    BLABS_KUBE_NAMESPACE: "labs"
    BLABS_KUBE_VM_STORAGE_CLASS: "longhorn-r1"

runner:
  nodeSelector:
    nodepool: vm-runners
  tolerations:
    - key: "nodepool"
      operator: "Equal"
      value: "vm-runners"
      effect: "NoSchedule"
  privileged: false
  vmNetBackend: user
  podSecurityContext:
    runAsNonRoot: false
  securityContext:
    allowPrivilegeEscalation: false

networkPolicy:
  enabled: true
  defaultDeny:
    ingress: true
    egress: true
  allow:
    frontendToBackend: true
    backendToDb: true
    backendToKubeApi: true
    dnsEgress: true
  vmConsoleSourceCidrs: []

database:
  postgres:
    replicas: 1
    storageClass: backend-postgres-sc
    size: 50Gi
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi
  migration:
    autoUpgrade: true

secrets:
  provider: external-secrets
  externalSecrets:
    enabled: true
    clusterSecretStore: corp-secrets
    postgresSecretName: bretter-postgres
    pullSecretName: ghcr-creds

quotas:
  namespace:
    pods: 400
    requestsCpu: "32"
    requestsMemory: 64Gi
    limitsCpu: "64"
    limitsMemory: 128Gi
    requestsStorage: 10Ti

backup:
  postgres:
    enabled: true
    schedule: "15 2 * * *"
    retentionDays: 14
  restoreValidation:
    enabled: true
    schedule: "30 2 * * 0"

observability:
  monitoring:
    enabled: true
  syntheticChecks:
    enabled: true
    afterDeploy: true
