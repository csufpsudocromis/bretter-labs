# Bretter Labs hardened production baseline values.
# This file only contains keys consumed by deploy/helm/files/app.yaml.tpl.
# It is validated in CI with scripts/validate_production_profile.py --strict.
# Apply environment-specific values through a separate overlay
# (deploy/helm/values-production-site.template.yaml) during deployment.

appTemplateValues:
  # Reference production coordinates used for baseline validation.
  # Treat these as site-specific and override via your production overlay.
  CONTROL_NODE: control-plane-1
  NODE_EXTERNAL_HOST: labs-gateway.internal
  RUNNER_NODE_SELECTOR_VALUE: runner-pool
  VM_STORAGE_CLASS: prod-vm-storage
  # Production profile requires immutable digest pins.
  BACKEND_IMAGE: ghcr.io/csufpsudocromis/bretter-backend@sha256:9431c8a0774ae07529d74c5b57b35a0cf93f66642955d67da884c3953d1ab2fe
  FRONTEND_IMAGE: ghcr.io/csufpsudocromis/bretter-frontend@sha256:ab276331c5c9f9125b3ed4b67fbfd057358f3d2132de713d20c4cc4db49a947a
  RUNNER_IMAGE: ghcr.io/csufpsudocromis/win-vm-runner@sha256:5a96b3743e1dabd2ae82f481edadc1cdbbd869a15b91891828a7e41305a40e76
  BACKEND_REPLICAS: "1"
  FRONTEND_REPLICAS: "2"
  PUBLIC_SCHEME: https
  TLS_SECRET_NAME: bretter-tls
  ADMIN_BOOTSTRAP_PASSWORD: ""
  WINDOWS_MACHINE_TYPE: q35
  WINDOWS_EFI_ENABLED: "true"
  WINDOWS_CPU_MODEL: host
  LINUX_MACHINE_TYPE: pc
  LINUX_EFI_ENABLED: "false"
  LINUX_CPU_MODEL: host
  VM_NET_BACKEND: user
  VM_RUNNER_PRIVILEGED: "0"
  VM_CONSOLE_EXTERNAL_TRAFFIC_POLICY: Local
  VM_CONSOLE_SOURCE_CIDRS: ""
  VM_CONSOLE_TICKET_LENGTH: "24"
  BACKEND_SERVICE_TYPE: ClusterIP
  BACKEND_SERVICE_NODEPORT_LINE: ""
  CONTAINER_INGRESS_ENABLED: "0"
  CONTAINER_INGRESS_CLASS: ""
  CONTAINER_INGRESS_BASE_DOMAIN: ""
  CONTAINER_INGRESS_ANNOTATIONS_JSON: "{}"
  CONTAINER_IMAGE_PREPULL_ENABLED: "1"
  CONTAINER_IMAGE_PREPULL_TIMEOUT_SECONDS: "45"
  CONTAINER_ALLOWED_REGISTRIES: docker.io,ghcr.io,quay.io,mcr.microsoft.com,gcr.io,registry.k8s.io,lscr.io
  CONTAINER_SIGNATURE_VERIFICATION_ENABLED: "1"
  CONTAINER_SIGNATURE_KEY_REF: /etc/bretter-signing/cosign.pub
  CONTAINER_SIGNATURE_KEY_SECRET_NAME: bretter-cosign-public-key
  CONTAINER_SCAN_ENABLED: "1"
  CONTAINER_SCAN_INTERVAL_MINUTES: "360"
  CONTAINER_SCAN_SEVERITY: HIGH,CRITICAL
  CONTAINER_START_QUEUE_ENABLED: "1"
  CONTAINER_START_QUEUE_BASE_DELAY_SECONDS: "20"
  CONTAINER_START_QUEUE_MAX_DELAY_SECONDS: "300"
  PRODUCTION_PROFILE: "1"
  CORS_ENTERPRISE_PROFILE: "1"
  CORS_ALLOWED_ORIGINS: "https://labs-gateway.internal:30073"
  CORS_ALLOWED_ORIGIN_REGEX: ""
  CORS_ALLOWED_METHODS: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
  CORS_ALLOWED_HEADERS: "Accept,Content-Type,Authorization"
  AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS: "300"
  AUTH_LOGIN_RATE_LIMIT_MAX_ATTEMPTS: "5"
  AUTH_LOGIN_LOCKOUT_SECONDS: "300"
  VM_CONNECT_INSECURE_TLS: "0"
  CONTAINER_CONNECT_INSECURE_TLS: "0"
  # Runtime secret injection path (do not commit raw encryption keys here).
  RUNTIME_SECRETS_SECRET_NAME: bretter-runtime-secrets
  RUNTIME_SECRETS_ENCRYPTION_KEY_KEY: secrets_encryption_key
  SECRETS_ENCRYPTION_KEY: ""
  BACKEND_DATA_HOSTPATH: /var/lib/bretter-labs/backend-data
  GOLDEN_IMAGES_HOSTPATH: /var/lib/bretter-labs/golden-images
  POSTGRES_DATA_HOSTPATH: /var/lib/bretter-labs/postgres-data
  CDI_UPLOAD_PROXY_URL: ""
