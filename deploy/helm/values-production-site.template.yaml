# Site-specific production override template (chart + setup policy values).
# Copy this file per environment, replace placeholders, and keep secrets out of git.
#
# Example:
# cp deploy/helm/values-production-site.template.yaml deploy/helm/values-prod-site.yaml
# $EDITOR deploy/helm/values-prod-site.yaml
# python3 scripts/validate_production_profile.py --strict \
#   -f deploy/helm/values-production.yaml \
#   -f deploy/helm/values-prod-site.yaml

appTemplateValues:
  # Optionally override replica counts per environment.
  BACKEND_REPLICAS: "1"
  FRONTEND_REPLICAS: "2"
  # Set min=max to keep fixed replicas, or raise max for scale-out.
  BACKEND_HPA_MIN_REPLICAS: "1"
  BACKEND_HPA_MAX_REPLICAS: "4"
  BACKEND_HPA_TARGET_CPU_UTILIZATION_PERCENT: "70"
  FRONTEND_HPA_MIN_REPLICAS: "2"
  FRONTEND_HPA_MAX_REPLICAS: "6"
  FRONTEND_HPA_TARGET_CPU_UTILIZATION_PERCENT: "70"
  UVICORN_WORKERS: "2"
  DATABASE_POOL_SIZE: "24"
  DATABASE_POOL_MAX_OVERFLOW: "32"
  DATABASE_POOL_TIMEOUT_SECONDS: "30"
  DATABASE_POOL_RECYCLE_SECONDS: "1800"
  DATABASE_STATEMENT_TIMEOUT_MS: "15000"
  DATABASE_SLOW_QUERY_MS: "500"
  BACKEND_IMAGE: ""
  BACKEND_ADMIN_IMAGE: ""
  CONTROL_NODE: "<control-node-hostname>"
  NODE_EXTERNAL_HOST: "<public-node-host-or-ip>"
  RUNNER_NODE_SELECTOR_VALUE: "<runner-node-selector-value>"
  VM_STORAGE_CLASS: "<vm-storage-class>"
  CORS_ALLOWED_ORIGINS: "https://<ui-origin-host>:30073"
  TLS_SECRET_NAME: "<tls-secret-name>"
  ORCHESTRATION_BACKEND: "dual"
  IMAGE_IMPORT_BACKEND: "crd"
  LABIMAGEIMPORT_CONTROLLER_ENABLED: "1"
  LABIMAGEIMPORT_CONTROLLER_LEADER_ELECTION_ENABLED: "1"
  LABIMAGEIMPORT_CONTROLLER_LEASE_NAME: bretter-labimageimport-controller-leader
  LABIMAGEIMPORT_CONTROLLER_POLL_SECONDS: "10"
  TEAM_NAMESPACE_MODE: per_team
  TEAM_NAMESPACE_PREFIX: "labs-team-"
  TEAM_NAMESPACE_BOOTSTRAP_ENABLED: "1"
  KUBE_USE_KVM: "true"
  VM_NET_BACKEND: user
  VM_RUNNER_PRIVILEGED: "0"
  VM_PRIVILEGED_RUNTIME_ISOLATION_ENABLED: "1"
  VM_PRIVILEGED_NAMESPACE_PREFIX: "labs-vm-priv-"
  REQUIRE_SCHEMA_READY: "1"
  EXPECTED_ALEMBIC_REVISION: ""
  # Keep empty in committed values files. Inject key material via runtime Kubernetes Secret.
  SECRETS_ENCRYPTION_KEY: ""
  RUNTIME_SECRETS_SECRET_NAME: "<runtime-secret-name>"
  RUNTIME_SECRETS_ENCRYPTION_KEY_KEY: "<runtime-secret-key-name>"
  CONTAINER_SIGNATURE_VERIFICATION_ENABLED: "1"
  CONTAINER_SIGNATURE_KEY_REF: /etc/bretter-signing/cosign.pub
  CONTAINER_SIGNATURE_KEY_SECRET_NAME: "<signature-key-secret-name>"
  KYVERNO_SIGNATURE_SCOPE: namespace_first_party
  KYVERNO_SIGNATURE_IMAGE_PATTERNS: "ghcr.io/csufpsudocromis/*"
  POST_DEPLOY_AUTH_SECRET_NAME: "<postdeploy-auth-secret-name>"
  POST_DEPLOY_AUTH_ADMIN_USERNAME_KEY: admin_username
  POST_DEPLOY_AUTH_ADMIN_PASSWORD_KEY: admin_password
  POST_DEPLOY_AUTH_SYNTHETIC_USERNAME_KEY: synthetic_username
  POST_DEPLOY_AUTH_SYNTHETIC_PASSWORD_KEY: synthetic_password
  ENABLE_USERFLOW_SLO_RDP_CONNECT_LATENCY_PROBE: "1"
  USERFLOW_SLO_RDP_CONNECT_LATENCY_SECONDS: "20"
  USERFLOW_SLO_RDP_CONNECT_FAILURE_RATE_PCT: "25"
  USERFLOW_SLO_RDP_CONNECT_REQUIRE_INSTANCE: "0"
  USERFLOW_SLO_API_AUTH_SECRET_NAME: "<rdp-slo-auth-secret-name>"
  USERFLOW_SLO_API_AUTH_USERNAME_KEY: username
  USERFLOW_SLO_API_AUTH_PASSWORD_KEY: password
  USERFLOW_SLO_API_AUTH_MANAGED_BY_SETUP: "0"
  ENABLE_POSTGRES_BACKUP_REPLICATION: "1"
  POSTGRES_BACKUP_REPLICATION_BUCKET: "<backup-bucket-name>"
  POSTGRES_BACKUP_REPLICATION_PREFIX: "postgres"
  POSTGRES_BACKUP_REPLICATION_REGION: "us-east-1"
  POSTGRES_BACKUP_REPLICATION_ENDPOINT: ""
  POSTGRES_BACKUP_REPLICATION_SECRET_NAME: "<backup-replication-secret-name>"
  POSTGRES_BACKUP_REPLICATION_ACCESS_KEY_ID_KEY: aws_access_key_id
  POSTGRES_BACKUP_REPLICATION_SECRET_ACCESS_KEY_KEY: aws_secret_access_key
  POSTGRES_BACKUP_REPLICATION_SESSION_TOKEN_KEY: aws_session_token
  POSTGRES_BACKUP_REPLICATION_SSE_MODE: AES256
  POSTGRES_BACKUP_REPLICATION_SSE_KMS_KEY_ID: ""
  POSTGRES_BACKUP_REPLICATION_OBJECT_LOCK_MODE: GOVERNANCE
  POSTGRES_BACKUP_REPLICATION_OBJECT_LOCK_DAYS: "30"
